[default]
# Provider actif parmi les sections ci-dessous
active_provider = pollinations
delay_between_requests = 2.0
timeout = 60
output_format = jpeg

# ── Pollinations (gratuit, sans clé) ─────────────────────────────────────────
[pollinations]
type         = url_template
url_template = https://image.pollinations.ai/prompt/{prompt}?width={width}&height={height}&nologo=true&model=flux
width        = 768
height       = 768
api_key      =

# ── OpenAI DALL-E 3 ───────────────────────────────────────────────────────────
[openai_dalle]
type    = openai
model   = dall-e-3
width   = 1024
height  = 1024
quality = standard
api_key = sk-...

# ── Stability AI ──────────────────────────────────────────────────────────────
[stability]
type    = stability
model   = stable-diffusion-xl-1024-v1-0
width   = 1024
height  = 1024
steps   = 30
api_key = sk-...

# ── Automatic1111 (instance locale) ──────────────────────────────────────────
[automatic1111]
type      = automatic1111
base_url  = http://127.0.0.1:7860
model     = v1-5-pruned-emaonly
width     = 512
height    = 512
steps     = 20
cfg_scale = 7
api_key   =

# ── ComfyUI (instance locale) ────────────────────────────────────────────────
[comfyui]
type     = comfyui
base_url = http://127.0.0.1:8188
model    = sd_xl_base_1.0.safetensors
width    = 800
height   = 1200
steps    = 25
api_key  =
